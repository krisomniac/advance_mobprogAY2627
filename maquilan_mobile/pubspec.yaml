name: maquilan_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 6.1.6

environment:
  sdk: '>=3.8.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: 5.2.1
  flutter_screenutil: 5.9.3
  http: 1.5.0
  provider: 6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  assets:
    - assets/
    - assets/images/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
  uses-material-design: true